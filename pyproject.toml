[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-drug-lab"
version = "0.1.0"
description = "Local-first, reproducible computational drug-discovery learning workflows."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Open Drug Lab contributors" }
]
keywords = [
  "drug-discovery",
  "cheminformatics",
  "rdkit",
  "reproducibility",
  "education"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
chem = [
  "rdkit>=2023.9",
  "pandas>=2.1",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
odl = "opendruglab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opendruglab"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
